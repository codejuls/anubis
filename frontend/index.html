<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Anubis - Live Sandbox Portal</title>
    <style>
        /* 
           THE MINT-EMERALD GLASSMORPHISM PALETTE:
           - 60% Dominant (Base): Warm cream & frosted ice backdrop (#f7f9f6 with ambient soft green gradient)
           - 30% Secondary (Structure): Emerald Forest (#047857), Deep Jade Slate (#0f291e), and Soft Mint Glass (#d1fae5 / rgba(255,255,255,0.75))
           - 10% Accent (Action/Energy): Vibrant Emerald Mint (#10b981 / #059669)
        */
        :root {
            --bg-color: #f7f9f6;          /* Base soft cream/mint environment */
            --card-glass: rgba(255, 255, 255, 0.82); /* Glassmorphism translucent container */
            --glass-border: rgba(16, 185, 129, 0.22); /* Translucent emerald glass border */
            --text-main: #0f291e;         /* Deep Jade Charcoal text */
            --text-secondary: #475569;    /* Muted Slate details */
            
            --emerald-primary: #059669;    /* Deep Emerald for headers */
            --emerald-dark: #047857;       /* Dark Emerald */
            --emerald-light-bg: #ecfdf5;   /* Soft mint surface tint */
            
            --accent-green: #10b981;      /* Vibrant Mint Green CTA */
            --accent-green-hover: #059669;
            --accent-green-dark: #065f46;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(209, 250, 229, 0.2) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 25px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 18px 24px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(16, 185, 129, 0.05);
        }

        .title-area h1 {
            color: var(--emerald-primary);
            margin: 0;
            font-size: 26px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
        }

        .title-area h1 span {
            color: var(--accent-green);
        }

        .title-area p {
            color: var(--text-secondary);
            margin: 5px 0 0 0;
            font-size: 14.5px;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            background: var(--emerald-primary);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
            border: 1px solid var(--accent-green);
        }

        .btn-generate {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-generate:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
        }

        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Two-column layout for main workspaces */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        /* Smart NLP Suggestion Glass Card (Milestone #2) */
        .suggestion-card {
            background: rgba(236, 253, 245, 0.92); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--accent-green);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 13.5px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.15);
        }

        .suggestion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .suggestion-title {
            color: var(--accent-green-dark); 
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .severity-chip {
            background: #059669;
            color: #ffffff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .suggestion-details {
            color: var(--text-main);
            line-height: 1.5;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 10px 14px;
            border-radius: 8px;
        }

        .suggestion-citation {
            font-size: 12px;
            color: var(--emerald-dark);
            font-style: italic;
            margin-top: 4px;
        }

        .suggestion-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .toast-action {
            background: var(--accent-green);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
        }

        .toast-action:hover {
            background-color: var(--accent-green-hover);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-area">
            <h1><span>𓁢</span> Project Anubis Sandbox Portal</h1>
            <p>Interactive Clinical Chart Modeling & Financial Impact Simulator</p>
        </div>
        <div class="header-actions">
            <button class="btn-generate" id="generate-btn">
                🎲 Generate New Case
            </button>
            <span class="badge">Ecosystem MVP</span>
        </div>
    </div>

    <!-- Smart NLP Code Suggestion Glass Card (Milestone #2) -->
    <div class="suggestion-card" id="suggestion-box" style="display: none;">
        <div class="suggestion-header">
            <div class="suggestion-title">
                ⚡ <span>Anubis NLP Entity Match</span>
            </div>
            <span class="severity-chip" id="suggest-severity">MCC</span>
        </div>
        
        <div class="suggestion-details">
            Excerpt: <em id="suggest-excerpt">"Temp 102.1°F"</em><br>
            Suggested Code: <strong id="suggest-code" style="color: var(--emerald-dark); font-size: 15px;">A41.9</strong> — <span id="suggest-desc">Sepsis, unspecified organism</span>
            <div class="suggestion-citation" id="suggest-citation">Source: AHA Coding Clinic Q4 2023, p. 8</div>
            <div style="font-size: 12.5px; color: var(--text-secondary); margin-top: 6px;" id="suggest-rationale"></div>
        </div>

        <div class="suggestion-actions">
            <button class="toast-action" id="apply-code-btn">➕ Apply Code to Workspace</button>
        </div>
    </div>

    <div class="workspace">
        <!-- Custom Component: Clinical Chart Viewer -->
        <clinical-chart-viewer id="chart"></clinical-chart-viewer>

        <!-- Custom Component: Abstractor Workspace Form -->
        <code-entry-form id="form"></code-entry-form>
    </div>

    <!-- Custom Component: Telemetry & Evaluation Panel -->
    <telemetry-panel id="telemetry"></telemetry-panel>

    <!-- Load Custom Web Components as ES Modules -->
    <script type="module">
        import "./components/ClinicalChartViewer.js";
        import "./components/CodeEntryForm.js";
        import "./components/TelemetryPanel.js";

        const chart = document.getElementById('chart');
        const form = document.getElementById('form');
        const telemetry = document.getElementById('telemetry');
        const generateBtn = document.getElementById('generate-btn');
        
        const suggestionBox = document.getElementById('suggestion-box');
        const suggestExcerpt = document.getElementById('suggest-excerpt');
        const suggestCode = document.getElementById('suggest-code');
        const suggestDesc = document.getElementById('suggest-desc');
        const suggestSeverity = document.getElementById('suggest-severity');
        const suggestCitation = document.getElementById('suggest-citation');
        const suggestRationale = document.getElementById('suggest-rationale');
        const applyCodeBtn = document.getElementById('apply-code-btn');

        let currentSuggestedCode = "";
        let currentSeverity = "";

        // 1. Generate Case Button Handler
        generateBtn.addEventListener('click', async () => {
            try {
                generateBtn.disabled = true;
                generateBtn.innerHTML = "⏳ Generating Case...";
                suggestionBox.style.display = 'none';

                const response = await fetch('/api/generate');
                if (!response.ok) throw new Error("Generation request failed");

                const casePackage = await response.json();

                // Update chart viewer with new synthetic narrative
                chart.updateChart(casePackage.case_id, casePackage.unstructured_document.narrative);

                // Reset abstractor workspace inputs
                form.resetForm();

                // Update telemetry panel gold standard and reset state
                telemetry.setGoldStandard(casePackage.gold_standard);
                telemetry.resetDefault();

            } catch (err) {
                console.error("Generate error:", err);
                alert(`Case generation failed: ${err.message}`);
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = "🎲 Generate New Case";
            }
        });

        // 2. Listen for text selection / highlight events and query POST /api/extract (Milestone #2)
        document.addEventListener('TextHighlighted', async (event) => {
            const text = event.detail.text;

            try {
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ selected_text: text })
                });

                if (!response.ok) return;

                const nlpData = await response.json();

                currentSuggestedCode = nlpData.suggested_code;
                currentSeverity = nlpData.severity_type;

                suggestExcerpt.innerText = `"${nlpData.entity_text}"`;
                suggestCode.innerText = nlpData.suggested_code;
                suggestDesc.innerText = nlpData.description;
                suggestSeverity.innerText = nlpData.severity_type;
                suggestCitation.innerText = `Source: ${nlpData.official_citation} (${nlpData.source})`;
                suggestRationale.innerText = nlpData.rationale;

                suggestionBox.style.display = 'flex';

            } catch (err) {
                console.error("NLP extraction failed:", err);
            }
        });

        // Apply suggested code to workspace
        applyCodeBtn.addEventListener('click', () => {
            if (currentSuggestedCode) {
                if (currentSeverity === "Principal Candidate") {
                    // Set as Principal
                    const pdxInput = form.shadowRoot.getElementById('pdx');
                    if (pdxInput) pdxInput.value = currentSuggestedCode;
                } else {
                    // Append as Secondary
                    form.appendSecondaryCode(currentSuggestedCode);
                }
                suggestionBox.style.display = 'none';
            }
        });

        // 3. Listen for claim submissions from CodeEntryForm
        document.addEventListener('ClaimSubmitted', async (event) => {
            const payload = event.detail;

            try {
                suggestionBox.style.display = 'none';

                // Query the FastAPI backend at relative path /api/analyze
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Server returned an error");
                }

                const result = await response.json();

                // Pass result to TelemetryPanel for rendering and grading
                telemetry.showResult(result, payload);

                // Scroll down smoothly to show results
                telemetry.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                console.error("Analysis request failed:", error);
                alert(`Analysis failed: ${error.message}`);
            }
        });
    </script>
</body>
</html>
